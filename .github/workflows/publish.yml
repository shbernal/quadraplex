name: Publish

# Pushing a `vX.Y.Z` tag is the release. npm trusts this workflow by its file name, so
# renaming it means changing the trusted publisher on npmjs.com too.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - name: Check the tag matches the version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - name: Check the bundle runs under node
        run: node dist/cli.js --version
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest
      # The build above is what ships, so prepack is skipped rather than run a second time.
      - run: npm publish --access public --provenance --ignore-scripts
      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
